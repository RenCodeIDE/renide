directories:
  output: release
  buildResources: resources/darwin
appId: com.yourco.ren
productName: Ren
files:
  - filter:
      - out/**/*
      - extensions/**/*
      - resources/**/*
      - product.json
      - package.json
      - '!**/node_modules/**'
      - node_modules/**/*
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: true
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: resources/darwin/code.icns
artifactName: ${productName}-${version}-${arch}.dmg
extraMetadata:
  main: ./out/main.js
electronVersion: 37.7.0

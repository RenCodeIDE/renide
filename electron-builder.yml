appId: com.ren.renide
productName: Ren

directories:
  output: release
  buildResources: resources/darwin # we’ll tell it to look here for icons

files:
  - out/**/*
  - resources/**/*
  - .build/extensions/**/*
  - product.json
  - package.json
  - "node_modules/**/*"
  - "!**/node_modules/**/*.{md,ts,tsx,js.map}"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@vscode/ripgrep/**"
  - "**/node_modules/node-pty/**"
  - ".build/extensions/**"

npmRebuild: true

mac:
  target: [dmg]
  category: public.app-category.developer-tools
  icon: resources/darwin/code.icns # <-- full path to your .icns file

artifactName: "${productName}-${version}-${arch}.dmg"

extraMetadata:
  main: "./out/main.js"
